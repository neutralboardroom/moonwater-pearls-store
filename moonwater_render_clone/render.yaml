services:
  - type: web
    name: moonwater-pearls
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PUBLIC_BASE_URL
        value: https://moonwaterpearls.com
      - key: BRAND_PHONE
        value: 1-800-363-4719
      - key: STRIPE_SECRET_KEY
        sync: false
